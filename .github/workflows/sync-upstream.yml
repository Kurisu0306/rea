name: Sync upstream

on:
  schedule:
    # 08:17 Asia/Shanghai (UTC+8); avoid the busy top of the hour.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Kurisu0306/rea' && github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve fork and upstream
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GH_REPO}")"
          upstream="$(jq -er '.parent.full_name' <<< "$metadata")"
          upstream_branch="$(gh api "repos/${upstream}" --jq '.default_branch')"
          {
            printf 'branch=%s\n' "$(jq -er '.default_branch' <<< "$metadata")"
            printf 'upstream=%s\n' "$upstream"
            printf 'upstream_branch=%s\n' "$upstream_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Check out fork with repository-scoped sync key
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.repository.outputs.branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.REA_UPSTREAM_SYNC_KEY }}
          persist-credentials: true

      - name: Merge and push upstream updates
        env:
          DEFAULT_BRANCH: ${{ steps.repository.outputs.branch }}
          UPSTREAM_REPO: ${{ steps.repository.outputs.upstream }}
          UPSTREAM_BRANCH: ${{ steps.repository.outputs.upstream_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          upstream_commit="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            printf 'Already up to date with `%s:%s` (`%s`).\n' \
              "$UPSTREAM_REPO" "$UPSTREAM_BRANCH" "$upstream_commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve fork-only commits. Conflicts fail without changing the remote.
          # The merge commit skips unrelated push CI; scheduled/manual sync still runs.
          git -c core.hooksPath=/dev/null merge --no-ff "$upstream_commit" \
            -m "chore: sync upstream ${UPSTREAM_REPO}:${UPSTREAM_BRANCH} [skip ci]"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          {
            printf '### Upstream sync completed\n\n'
            printf -- '- Upstream: `%s:%s`\n' "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"
            printf -- '- Upstream commit: `%s`\n' "$upstream_commit"
            printf -- '- Fork commit: `%s`\n' "$(git rev-parse HEAD)"
            printf '\nFork-only commits were preserved.\n'
          } >> "$GITHUB_STEP_SUMMARY"
